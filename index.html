<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surpresa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- música em loop -->
  <audio id="music" loop preload="auto">
    <source src="travelers.mp3" type="audio/mpeg">
  </audio>

  <!-- céu estrelado (preenchido pelo script) -->
  <div class="sky"></div>

  <main class="hero">
    <section class="hero-text">
      <h1>
        O tempo pode reiniciar quantas vezes for, mas em qualquer universo
        eu escolheria recriar <span class="fire">a fogueira</span>
        com <span class="you">você</span>.
      </h1>
      <p class="signature"></p>
    </section>

    <div class="hero-art">
      <img src="planeta.gif" alt="Planeta em pixel art">
    </div>
  </main>

  <!-- botão de som -->
  <button class="sound off" id="sound" aria-label="Tocar música">♪</button>

  <script>
    const sky = document.querySelector('.sky');
    const rand = (min, max) => Math.random() * (max - min) + min;

    // ---------- ESTRELAS ----------
    function addStar(cls, size, area) {
      const s = document.createElement('span');
      s.className = cls;
      if (size) s.style.width = s.style.height = size + 'px';
      s.style.left = rand(area[0], area[1]) + '%';
      s.style.top = rand(area[0], area[1]) + '%';
      s.style.setProperty('--blink-dur', rand(1.5, 4.5) + 's');
      s.style.setProperty('--blink-delay', -rand(0, 5) + 's');
      s.style.setProperty('--pop-delay', rand(0, 1.2) + 's');  // brotam em ordem aleatória
      sky.appendChild(s);
    }
    for (let i = 0; i < 110; i++) addStar('star', Math.random() < .75 ? 2 : 3, [0, 100]);
    for (let i = 0; i < 14; i++)  addStar('sparkle', 0, [2, 98]);

    // ---------- ANIMAÇÃO DE ENTRADA (automática) ----------
    requestAnimationFrame(() => document.body.classList.add('entered'));

    // ---------- MÚSICA ----------
    const music = document.getElementById('music');
    const soundBtn = document.getElementById('sound');
    const TARGET_VOLUME = 0.6;
    music.volume = TARGET_VOLUME;

    // avisa no Console se o arquivo não for encontrado
    music.querySelector('source').addEventListener('error', () => {
      console.error('Não achei o "travelers.mp3". Confira se ele está na mesma pasta do index.html e se o nome não ficou "travelers.mp3.mp3".');
    });

    let fadeTimer = null;
    function fadeVolume(target, ms) {
      clearInterval(fadeTimer);
      const steps = 30, start = music.volume;
      let n = 0;
      fadeTimer = setInterval(() => {
        n++;
        music.volume = Math.min(1, Math.max(0, start + (target - start) * (n / steps)));
        if (n >= steps) clearInterval(fadeTimer);
      }, ms / steps);
    }

    function setBtn(playing) {
      soundBtn.classList.toggle('off', !playing);
      soundBtn.setAttribute('aria-label', playing ? 'Pausar música' : 'Tocar música');
    }

    function startMusic(fade = true) {
      music.volume = fade ? 0 : TARGET_VOLUME;
      return music.play().then(() => {
        if (fade) fadeVolume(TARGET_VOLUME, 4000);   // volume sobe devagarinho
        setBtn(true);
        stopListening();
      }).catch(err => {
        music.volume = TARGET_VOLUME;                // não deixa o volume preso no zero
        console.warn('Música ainda não tocou:', err.name, '-', err.message);
        setBtn(false);
        throw err;
      });
    }

    // se o navegador bloquear o som automático, toca na primeira interação
    const unlockEvents = ['click', 'touchend', 'keydown'];
    function unlock(e) {
      if (e.target.closest && e.target.closest('#sound')) return;   // o botão cuida de si
      if (music.paused) startMusic().catch(() => {});                // se falhar, continua ouvindo
    }
    function stopListening() {
      unlockEvents.forEach(ev => document.removeEventListener(ev, unlock));
    }
    unlockEvents.forEach(ev => document.addEventListener(ev, unlock));

    // tenta tocar assim que a página abre
    startMusic().catch(() => {});

    soundBtn.addEventListener('click', () => {
      if (music.paused) {
        startMusic(false).catch(() => {});
      } else {
        music.pause();
        setBtn(false);
      }
    });
  </script>
</body>
</html>
