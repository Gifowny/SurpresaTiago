<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surpresa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- céu estrelado (preenchido pelo script) -->
  <div class="sky"></div>

  <main class="hero">
    <section class="hero-text">
      <p class="tag">✦ PLACEHOLDER ✦</p>
      <h1>Surpresa,<br><span>Tiago!</span></h1>
    </section>

    <div class="hero-art">
      <img src="planeta.gif" alt="Planeta em pixel art">
    </div>
  </main>

  <script>
    const sky = document.querySelector('.sky');
    const rand = (min, max) => Math.random() * (max - min) + min;

    // estrelinhas (pontos que piscam)
    for (let i = 0; i < 110; i++) {
      const s = document.createElement('span');
      s.className = 'star';
      const size = Math.random() < 0.75 ? 2 : 3;
      s.style.width = s.style.height = size + 'px';
      s.style.left = rand(0, 100) + '%';
      s.style.top = rand(0, 100) + '%';
      s.style.animationDuration = rand(1.5, 4.5) + 's';
      s.style.animationDelay = -rand(0, 5) + 's';
      sky.appendChild(s);
    }

    // estrelas em cruz (crescem e encolhem)
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.style.left = rand(2, 98) + '%';
      s.style.top = rand(2, 98) + '%';
      s.style.animationDuration = rand(2, 4) + 's';
      s.style.animationDelay = -rand(0, 4) + 's';
      sky.appendChild(s);
    }
  </script>
</body>
</html>
